<!DOCTYPE html>
<!--
  [수업 1] HTML = 웹페이지의 "뼈대"
  <태그>내용</태그> 모양으로 "이건 제목이야", "이건 문단이야" 하고 이름표를 붙이는 거예요.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>내 이름 | 영상 편집 포트폴리오</title>
  <meta name="description" content="영상 편집자 포트폴리오" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 맨 위 메뉴 -->
  <header class="site-header">
    <a class="logo" href="#top">내 이름</a>
    <nav>
      <a href="#work">작업물</a>
      <a href="#about">소개</a>
      <a href="#contact">연락</a>
    </nav>
  </header>

  <main id="top">

    <!-- 첫 화면 -->
    <section class="hero">
      <p class="eyebrow">VIDEO EDITOR</p>
      <h1>이야기를 <br />편집합니다.</h1>
      <p class="lead">한 줄 소개를 여기에 적어보세요. 예: 브랜드 영상, 유튜브, 숏폼을 편집합니다.</p>
      <a class="button" href="#work">작업물 보기 ↓</a>
    </section>

    <!-- 작업물 목록 -->
    <section id="work" class="section">
      <h2>Work</h2>

      <div class="grid">

        <!-- ▼ 카드 한 개 = 영상 한 개. 복사해서 늘리면 됩니다. -->

        <!-- (A) 유튜브 영상: data-type="youtube", data-id에 영상 주소의 v= 뒤 글자를 넣어요 -->
        <button class="card" data-type="youtube" data-id="aqz-KE-bpKQ">
          <div class="thumb">
            <img src="https://img.youtube.com/vi/aqz-KE-bpKQ/hqdefault.jpg" alt="" loading="lazy" />
            <span class="play">▶</span>
          </div>
          <h3>샘플 영상 (YouTube)</h3>
          <p>2024 · 컷 편집, 색보정</p>
        </button>

        <!-- (B) 직접 올린 mp4: data-type="mp4", data-src에 파일 경로를 넣어요 -->
        <button class="card" data-type="mp4" data-src="videos/sample.mp4">
          <div class="thumb placeholder">
            <!-- 썸네일 이미지를 thumbs/ 폴더에 넣고 아래 줄 주석을 풀어 쓰세요 -->
            <!-- <img src="thumbs/sample.jpg" alt="" loading="lazy" /> -->
            <span class="play">▶</span>
          </div>
          <h3>샘플 영상 (mp4)</h3>
          <p>2024 · 모션 그래픽</p>
        </button>

      </div>
    </section>

    <!-- 소개 -->
    <section id="about" class="section">
      <h2>About</h2>
      <p>
        여기에 자기소개를 적어보세요. 어떤 편집을 좋아하는지, 쓰는 프로그램
        (Premiere Pro, DaVinci Resolve, Final Cut 등), 작업 경력 등.
      </p>
    </section>

    <!-- 연락 -->
    <section id="contact" class="section">
      <h2>Contact</h2>
      <p><a href="mailto:you@example.com">you@example.com</a></p>
      <p><a href="https://instagram.com/" target="_blank" rel="noopener">Instagram</a> ·
         <a href="https://youtube.com/" target="_blank" rel="noopener">YouTube</a></p>
    </section>

  </main>

  <footer class="site-footer">© 2026 내 이름</footer>

  <!-- 영상 재생 팝업(처음엔 숨겨져 있음) -->
  <div id="modal" class="modal" hidden>
    <button class="modal-close" aria-label="닫기">✕</button>
    <div class="modal-body" id="modal-body"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
