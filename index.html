<!DOCTYPE html>
<!--
  [수업 1] HTML = 웹페이지의 "뼈대"
  <태그>내용</태그> 모양으로 "이건 제목이야", "이건 문단이야" 하고 이름표를 붙이는 거예요.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MaRu_2 | 영상 편집 포트폴리오</title>
  <meta name="description" content="영상 편집자 포트폴리오" />
  <link rel="stylesheet" href="style.css" />
  <!-- 자바스크립트가 켜져 있을 때만 "나타나는 애니메이션"을 쓰기 위한 표시 (꺼져 있으면 모든 내용이 그냥 보여요) -->
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>

  <!-- 맨 위 메뉴 (글자와 보이기/숨기기는 site.js 의 nav · sections 로 바뀌어요) -->
  <header class="site-header">
    <a class="logo" href="#top">MaRu_2</a>
    <nav>
      <a href="#about" data-nav="about">소개</a>
      <a href="#work" data-nav="work">작업물</a>
      <a href="#contact" data-nav="contact">연락</a>
    </nav>
  </header>

  <main id="top">

    <!-- 첫 화면 (아래 글자는 기본값이고, 실제 문구는 site.js 의 hero 로 바뀌어요. 고칠 때는 관리 페이지(admin.html)나 site.js 에서!) -->
    <section class="hero">
      <!-- 배경: 천천히 퍼지는 둥근 파동 (장식이라 스크린리더는 건너뛰어요. 켜기/끄기는 관리 페이지의 효과에서) -->
      <div class="hero-bg" aria-hidden="true"><span></span><span></span></div>
      <!-- 글자들을 한 덩어리로 묶어 둔 것: 스크롤하면 이 덩어리가 위로 올라가며 흐려져요 -->
      <div class="hero-inner">
        <p class="eyebrow">VIDEO EDITOR</p>
        <h1>소리가 주는 감동을 <br />시각적으로 표현하자</h1>
        <p class="lead">mv,amv</p>
        <a class="button" href="#work">works ↓</a>
      </div>
      <span class="scroll-cue" aria-hidden="true"></span>
    </section>
    
    <!-- 소개 -->
    <section id="about" class="section">
      <h2>About</h2>
      <div class="about">
       <img class="about-img" id="about-img" src="images/logo.png" alt="MaRu_2 로고" />
        <!-- 소개 글은 site.js 의 about 으로 채워져요. 고칠 때는 관리 페이지(admin.html)나 site.js 에서! -->
        <p id="about-text" class="about-text"></p>
      </div>
    </section>

    <!-- 작업물 목록 -->
    <section id="work" class="section">
      <h2>Work</h2>

      <!-- 카테고리 버튼: works.js 의 tags 로 자동 생성돼요 (tags 가 하나도 없으면 안 보여요) -->
      <div class="filters" id="filters" role="group" aria-label="카테고리" hidden></div>

      <!-- 카드는 works.js 의 목록으로 자동 생성돼요. 영상 추가는 관리 페이지(admin.html)나 works.js 에서! -->
      <div class="grid" id="grid"></div>
    </section>



    <!-- 연락 -->
    <section id="contact" class="section">
      <h2>Contact</h2>
      <!-- 이메일과 링크는 site.js 로 채워져요 (관리 페이지에서 고칠 수 있어요) -->
      <div id="contact-body"></div>
    </section>

  </main>

  <footer class="site-footer">© 2026 MaRu_2</footer>

  <!-- 영상 재생 팝업(처음엔 숨겨져 있음) -->
  <div id="modal" class="modal" hidden>
    <button class="modal-close" aria-label="닫기">✕</button>
    <div class="modal-body" id="modal-body"></div>
  </div>

  <script src="site.js"></script>
  <script src="works.js"></script>
  <script src="script.js"></script>
</body>
</html>
